<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Jean Bruno | Miandrs</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fullsatck developper">
    <base href="/">
    <link rel="shortcut icon" href="assets/logo/logo-icon.png" type="image/x-icon">
  </head>
  <body>
    <app-root>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5;">
        <div style="text-align: center;">
          <div style="border: 4px solid #e0e0e0; border-radius: 50%; border-top: 5px solid #2196f3; width: 150px; height: 150px; animation: spin 1s linear infinite; margin: 0 auto;">
            <img src="assets/logo/logo-icon.png" style="border: 1px solid #e0e0e0; border-radius: 50%; width: 150px; height: 150px; animation: spin 1s linear infinite; margin: 0 auto;" alt="Jean Bruno">
          </div>
          <p style="margin-top: 16px; font-family: 'Roboto', sans-serif; color: #616161;">Loading...</p>
        </div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </app-root>
  </body>
</html>
