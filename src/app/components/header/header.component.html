<header class="header">
    <nav class="nav">
        <div class="container">
            <div class="nav-content">
                <div class="logo">
                    <a href="#home" class="flex items-center miandrs">
                        @if (themeService.theme() === 'dark') {
                            <img ngSrc="assets/logo/logo-icon-header.png" width="60" height="60"
                                class="logo-icon" alt="Jean Bruno" priority>
                        } @else {
                            <img ngSrc="assets/logo/logo.png" width="60" height="60"
                                class="logo-icon" alt="Jean Bruno" priority>
                        }
                    </a>
                </div>
                
                <div class="nav-links" [class.nav-open]="isMenuOpen">
                    <a href="#home" class="nav-link" (click)="closeMenu()">Accueil</a>
                    <a href="#about" class="nav-link" (click)="closeMenu()">Apropos</a>
                    <a href="#skills" class="nav-link" (click)="closeMenu()">Compétences</a>
                    <a href="#projects" class="nav-link" (click)="closeMenu()">Projets</a>
                    <a href="#contact" class="nav-link" (click)="closeMenu()">Contact</a>
                    <button
                        class="theme-toggle"
                        (click)="toggleTheme()"
                        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
                    >
                        @if (themeService.theme() === 'dark') {
                        <!-- Sun -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                        </svg>
                        } @else {
                        <!-- Moon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                        }
                    </button>
                </div>
                
                <button class="mobile-menu-btn" (click)="toggleMenu()" aria-label="Toggle menu">
                    <span class="hamburger-line" [class.active]="isMenuOpen"></span>
                    <span class="hamburger-line" [class.active]="isMenuOpen"></span>
                    <span class="hamburger-line" [class.active]="isMenuOpen"></span>
                </button>
            </div>
        </div>
    </nav>
</header>
